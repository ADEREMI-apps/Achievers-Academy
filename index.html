<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
header{background:var(--g);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font:700 18px Georgia,serif}main{max-width:680px;margin:auto;padding:14px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}nav button{flex:1;min-width:80px;padding:10px;border:1px solid var(--bd);background:var(--card);border-radius:10px}
nav button.on{background:var(--g);color:#fff;border-color:var(--g)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
h2{font:700 16px Georgia,serif;margin:0 0 8px}input,select,textarea{width:100%;padding:10px;margin:4px 0;border:1px solid var(--bd);border-radius:8px;font:inherit;background:#fff}
.btn{padding:10px 14px;border:0;border-radius:8px;background:var(--g);color:#fff;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat b{display:block;font:700 20px Georgia,serif}
#doc{display:none;position:fixed;inset:0;background:var(--bg);overflow:auto;padding:16px;z-index:9}.paper{background:#fff;max-width:480px;margin:auto;padding:18px;border:1px solid var(--bd)}

const firebaseConfig={apiKey:"AIzaSyDTxyWoQh_bC9x2Y9Iu-GGwVNA4fSbeq18",authDomain:"achiever-academy-c1368.firebaseapp.com",projectId:"achiever-academy-c1368",storageBucket:"achiever-academy-c1368.firebasestorage.app",messagingSenderId:"205287742891",appId:"1:205287742891:web:fa439cfdbada0a71f9c6ee"};

G({google:()=>w(()=>signInWithPopup(auth,new GoogleAuthProvider())),

verify:bx=>w(()=>conf.confirm($('o'+bx).value.trim())),logout:()=>signOut(auth)});
onAuthStateChanged(auth,async u=>{me=u;$('out').style.display=u?'':'none';if(!u){loginView();return}
 try{const s=await getDoc(doc(db,'staff',(u.email||'_').toLowerCase()));isStaff=s.exists()}catch(e){isStaff=false;$('msg').textContent='Staff check failed: '+(e.code||e.message)}
 if(!isStaff&&u.email&&!$('msg').textContent)$('msg').innerHTML='Signed in as <b>'+esc(u.email)+'</b>. This email is not on the staff list yet.'
 isT=false;if(!isStaff&&u.phoneNumber){try{const t=await getDoc(doc(db,'tportal',u.phoneNumber));if(t.exists()){isT=true;T=t.data()}}catch(e){}}
 try{const p=await getDoc(doc(db,'settings','public'));P=p.exists()?p.data():{};cur=P.cur||'₦';$('sn').textContent='🏫 '+(P.name||'ACHIEVERS ACADEMY PORTAL')}catch(e){}
 if(isStaff){const s=await getDoc(doc(db,'settings','main'));S=s.exists()?s.data():{};
  for(const c of Object.keys(D))onSnapshot(collection(db,c),q=>{D[c]=q.docs.map(d=>({id:d.id,...d.data()}));render()});
  onSnapshot(collection(db,'claims'),q=>{C.length=0;q.docs.forEach(d=>C.push({id:d.id,...d.data()}));render()});tab='home'}
 else if(isT){tab='teacher'}else{tab='portal';onSnapshot(query(collection(db,'claims'),where('uid','==',u.uid)),q=>{C.length=0;q.docs.forEach(d=>C.push({id:d.id,...d.data()}));if(tab==='portal')render()})}
 render()});
function nav(){const t=isStaff?[['home','Dashboard'],['students','Students'],['pay','Payroll'],['set','Settings']]:[];$('nav').innerHTML=t.map(x=>`<button class="${tab===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
G({go:t=>{tab=t;sel=null;render()},$});
/* ---------- render ---------- */
function render(){if(!me)return;nav();const v=$('view');if(isT)return teacherView(v);if(!isStaff)return portalView(v);
 if(tab==='home'){const col=D.payments.reduce((a,p)=>a+p.amount,0),out=D.students.reduce((a,s)=>a+Math.max(bal(s),0),0),ps=D.salaries.filter(x=>x.month===mk()&&x.paid).reduce((a,x)=>a+x.amount,0),ow=D.students.filter(s=>bal(s)>0).sort((a,b)=>bal(b)-bal(a)).slice(0,30);
 v.innerHTML=`<div class="grid"><div class="card stat"><b class="ok">${money(col)}</b><span class="mu">Collected</span></div><div class="card stat"><b class="bad">${money(out)}</b><span class="mu">Outstanding</span></div><div class="card stat"><b>${money(ps)}</b><span class="mu">Salaries ${mk()}</span></div><div class="card stat"><b>${D.students.length}</b><span class="mu">Students</span></div></div>
 <div class="card acts"><button class="btn s" onclick="exStud()">Export fees CSV</button><a class="btn s o" href="${mail(S.prop,school()+' report',`Collected ${money(col)}\nOutstanding ${money(out)}`)}">Email proprietor</a><a class="btn s o" href="${mail(S.hm,school()+' report',`Collected ${money(col)}\nOutstanding ${money(out)}`)}">Email HM</a></div>
 <div class="card"><h2>Fee reminders</h2>${ow.map(s=>{const m=`Dear parent, ${s.name}'s fee balance at ${school()} is ${money(bal(s))}.`;return`<div class="row"><span>${esc(s.name)} <span class="mu">${esc(s.cls)}</span><br><b class="bad">${money(bal(s))}</b></span><span class="acts"><a class="btn s o" target="_blank" href="${wa(s.phone,m)}">WhatsApp</a><a class="btn s o" href="sms:${esc(s.phone)}?body=${encodeURIComponent(m)}">SMS</a></span></div>`}).join('')||'<span class="mu">Nobody owes.</span>'}</div>`}
 if(tab==='students'){if(sel){const s=D.students.find(x=>x.id===sel);if(!s){sel=null;return render()}const ps=D.payments.filter(p=>p.sid===sel).sort((a,b)=>b.date.localeCompare(a.date)),cl=C.filter(c=>c.code===s.code).sort((a,b)=>b.date.localeCompare(a.date));
  v.innerHTML=`<button class="btn s o" onclick="sel=null;render()">← Back</button><div class="card" style="margin-top:10px"><h2>${esc(s.name)}</h2><div class="mu">${esc(s.cls)} · ${esc(s.phone||'-')}</div><p>Fee ${money(s.fee)} · Paid ${money(paid(s.id))} · Balance <b class="${bal(s)>0?'bad':'ok'}">${money(bal(s))}</b></p><div class="mu">Parent code: <b>${esc(s.code)}</b> · <a target="_blank" href="${wa(s.phone,`Check ${s.name}'s fees at ${school()}: open ${location.origin} and enter code ${s.code}`)}">send on WhatsApp</a></div></div>
  ${cl.length?`<div class="card"><h2>Parent notices</h2>${cl.map(c=>`<div class="row"><span>${c.date}<br><span class="mu">${esc(c.note||'')}</span></span><span class="acts"><b>${money(c.amount)}</b>${c.status==='pending'?`<button class="btn s gd" onclick="confirmClaim('${s.id}','${c.id}')">Confirm received</button>`:'<span class="ok">✓</span>'}</span></div>`).join('')}</div>`:''}
  <div class="card"><h2>Record payment</h2><input id="pa" type="number" placeholder="Amount"><select id="pm"><option>Cash</option><option>Transfer</option><option>POS</option></select><button class="btn" onclick="pay('${s.id}')">Save payment</button></div>
  <div class="card"><h2>History</h2>${ps.map(p=>`<div class="row"><span>${p.date}<br><span class="mu">${esc(p.method)} · ${esc(p.rcpt)}</span></span><span class="acts"><b>${money(p.amount)}</b><button class="btn s o" onclick="receipt('${p.id}')">Receipt</button></span></div>`).join('')||'<span class="mu">None yet.</span>'}</div>`}
  else v.innerHTML=`<div class="card"><h2>Add student</h2><input id="n" placeholder="Full name"><input id="c" placeholder="Class (e.g. JSS 2)"><input id="p" placeholder="Parent phone"><input id="f" type="number" placeholder="Term fee"><button class="btn" onclick="addStudent()">Add</button></div>
  <div class="card"><h2>Import many</h2><div class="mu">Name, Class, Parent phone, Fee — one per line</div><textarea id="bi" rows="4"></textarea><button class="btn" onclick="bulk()">Import</button></div>
  <div class="card"><h2>Students (${fl().length})</h2><select onchange="fc=this.value;render()"><option value="">All classes</option>${[...new Set(D.students.map(s=>s.cls))].sort((a,b)=>ck(a)-ck(b)).map(c=>`<option ${c===fc?'selected':''}>${esc(c)}</option>`).join('')}</select><input placeholder="Search name" value="${esc(fq)}" onchange="fq=this.value.toLowerCase();render()"><button class="btn s o" onclick="slips()">Print code slips</button>
  ${fl().slice(0,150).map(s=>`<div class="row" onclick="sel='${s.id}';render()"><span>${C.some(c=>c.code===s.code&&c.status==='pending')?'🔔 ':''}${esc(s.name)} <span class="mu">${esc(s.cls)}</span></span><b class="${bal(s)>0?'bad':'ok'}">${bal(s)>0?money(bal(s)):'Paid ✓'}</b></div>`).join('')}</div>`}
 if(tab==='pay')v.innerHTML=`<div class="card"><h2>Add teacher</h2><input id="tn" placeholder="Name"><input id="te" placeholder="Email"><input id="tphn" placeholder="Phone +2348012345678" inputmode="tel"><input id="ts" type="number" placeholder="Monthly salary"><input id="td" type="number" placeholder="Monthly deduction"><input id="tb" placeholder="Bank"><input id="ta" placeholder="Account number"><button class="btn" onclick="addT()">Add</button></div>
  <div class="card acts"><button class="btn s" onclick="runPay()">Generate ${mk()} payroll</button><button class="btn s o" onclick="markAll()">Mark all paid</button><button class="btn s o" onclick="exBank()">Bank transfer CSV</button></div>
  <div class="card"><h2>Payroll ${mk()}</h2>${D.teachers.map(t=>{const x=sal(t);return`<div class="row"><span>${esc(t.name)}<br><span class="mu">Net ${money(x?x.amount:net(t))} · ${x?(x.paid?'Paid':'Due'):'Not run'}</span></span><span class="acts"><input style="width:80px" type="number" placeholder="Bonus" id="b${t.id}">${x&&x.paid?'':`<button class="btn s" onclick="paySal('${t.id}')">Pay</button>`}<button class="btn s o" onclick="slip('${t.id}')">Slip</button></span></div>`}).join('')||'<span class="mu">No teachers.</span>'}</div>`;
 if(tab==='set')v.innerHTML=`<div class="card"><h2>School settings</h2><input id="x1" placeholder="School name" value="${esc(S.name)}"><input id="x2" placeholder="Proprietor email" value="${esc(S.prop)}"><input id="x3" placeholder="HM email" value="${esc(S.hm)}"><input id="x4" placeholder="Bank name" value="${esc(S.bank)}"><input id="x5" placeholder="Account name" value="${esc(S.accName)}"><input id="x6" placeholder="Account number" value="${esc(S.accNo)}"><input id="x7" placeholder="Currency" value="${esc(S.cur||'₦')}" maxlength="4"><button class="btn" onclick="saveSet()">Save</button></div><div class="card mu">To add staff, add their Google email in Firebase console → Firestore → collection "staff" (document ID = email).</div>`}
function teacherView(v){v.innerHTML=`<div class="card"><h2>Welcome, ${esc(T.name)}</h2><div class="mu">Monthly salary ${money(T.salary)}</div></div><div class="card"><h2>My payslips</h2>${(T.slips||[]).sort((a,b)=>b.m.localeCompare(a.m)).map(x=>`<div class="row"><span>${x.m}<br><span class="mu">Bonus ${money(x.b)} · Deduction ${money(x.d)}</span></span><span><b>${money(x.a)}</b><br>${x.p?'<span class="ok">Paid '+esc(x.dt)+'</span>':'<span class="mu">Due</span>'}</span></div>`).join('')||'<span class="mu">No payslips yet.</span>'}</div>`}
function portalView(v){let codes=[];try{codes=JSON.parse(localStorage.getItem('codes')||'[]')}catch(e){}
 v.innerHTML=`<div class="card"><h2>My child's fees</h2><input id="pc" placeholder="Enter code from school"><button class="btn" onclick="addCode()">View</button></div><div id="pout"></div>`;
 codes.forEach(async c=>{try{const d=await getDoc(doc(db,'portal',c)),x=d.data();if(!x)return;const b=x.fee-x.paid,cl=C.filter(z=>z.code===c);
  $('pout').innerHTML+=`<div class="card"><h2>${esc(x.name)}</h2><div class="mu">${esc(x.cls)}</div><p>Fee ${money(x.fee)} · Paid ${money(x.paid)} · Balance <b class="${b>0?'bad':'ok'}">${money(b)}</b></p>${(x.pays||[]).map(p=>`<div class="row"><span>${p.d} <span class="mu">${esc(p.r)}</span></span><b>${money(p.a)}</b></div>`).join('')}</div>
  <div class="card"><h2>Pay to</h2>${P.accNo?`<b style="font-size:18px">${esc(P.accNo)}</b><br>${esc(P.accName)} · <span class="mu">${esc(P.bank)}</span>`:'<span class="mu">Account not set yet.</span>'}<h2 style="margin-top:12px">I have sent money</h2><input id="ca${c}" type="number" placeholder="Amount"><input id="cn${c}" placeholder="Reference / note"><button class="btn gd" onclick="claim('${c}')">Notify school</button>${cl.map(z=>`<div class="row"><span>${z.date}</span><span>${money(z.amount)} ${z.status==='pending'?'<span class="mu">Pending</span>':'<span class="ok">Confirmed ✓</span>'}</span></div>`).join('')}</div>`}catch(e){}})}
const syncT=async(t,ex)=>{if(!t.phone)return;const l=D.salaries.filter(x=>x.tid===t.id&&(!ex||x.id!==ex.id));if(ex)l.push(ex);await setDoc(doc(db,'tportal',t.phone),{name:t.name,salary:t.salary,slips:l.map(x=>({m:x.month,a:x.amount,b:x.bonus||0,d:x.ded||0,p:!!x.paid,dt:x.date||''}))})};
/* ---------- actions ---------- */
const pdoc=(s,extra={})=>({name:s.name,cls:s.cls,fee:s.fee,paid:paid(s.id),pays:D.payments.filter(p=>p.sid===s.id).map(p=>({d:p.date,a:p.amount,r:p.rcpt})),...extra});
G({addCode:()=>{const c=val('pc').toUpperCase();if(!c)return;let a=[];try{a=JSON.parse(localStorage.getItem('codes')||'[]')}catch(e){}if(!a.includes(c))a.push(c);try{localStorage.setItem('codes',JSON.stringify(a))}catch(e){}render()},
claim:c=>{const a=+$('ca'+c).value;if(!a)return;w(()=>setDoc(doc(db,'claims',uid()),{code:c,uid:me.uid,amount:a,note:$('cn'+c).value,date:today(),status:'pending'}))},
addStudent:()=>{const n=val('n');if(!n)return;const code=uid().slice(-6).toUpperCase()+Math.floor(Math.random()*90+10),s={name:n,cls:val('c'),phone:val('p'),fee:+val('f')||0,code},id=uid();w(async()=>{await setDoc(doc(db,'students',id),s);await setDoc(doc(db,'portal',code),pdoc({...s,id}))})},
bulk:()=>w(async()=>{const L=val('bi').split('\n').map(l=>l.split(/[,\t]/).map(x=>x.trim())).filter(r=>r[0]);for(let i=0;i<L.length;i+=200){const b=writeBatch(db);L.slice(i,i+200).forEach(r=>{const id=uid(),code=uid().slice(-6).toUpperCase()+Math.floor(Math.random()*90+10),s={name:r[0],cls:r[1]||'',phone:r[2]||'',fee:+r[3]||0,code};b.set(doc(db,'students',id),s);b.set(doc(db,'portal',code),pdoc({...s,id}))});await b.commit();$('msg').textContent='Imported '+Math.min(i+200,L.length)+'/'+L.length}$('bi').value=''}),
pay:sid=>{const a=+val('pa');if(!a)return;const s=D.students.find(x=>x.id===sid),p={sid,amount:a,method:val('pm'),date:today(),rcpt:'R'+String(D.payments.length+1).padStart(5,'0')};w(async()=>{await setDoc(doc(db,'payments',uid()),p);const b=pdoc(s);await setDoc(doc(db,'portal',s.code),{...b,paid:b.paid+a,pays:[...b.pays,{d:p.date,a,r:p.rcpt}]})})},
confirmClaim:(sid,cid)=>{const s=D.students.find(x=>x.id===sid),c=C.find(x=>x.id===cid),p={sid,amount:c.amount,method:'Transfer',date:today(),rcpt:'R'+String(D.payments.length+1).padStart(5,'0')};w(async()=>{await setDoc(doc(db,'payments',uid()),p);await updateDoc(doc(db,'claims',cid),{status:'confirmed'});const b=pdoc(s);await setDoc(doc(db,'portal',s.code),{...b,paid:b.paid+p.amount,pays:[...b.pays,{d:p.date,a:p.amount,r:p.rcpt}]})})},
receipt:id=>{const p=D.payments.find(x=>x.id===id),s=D.students.find(x=>x.id===p.sid);showDoc(`<h2>${esc(school())}</h2><b>Receipt ${esc(p.rcpt)}</b><hr>${esc(s.name)} (${esc(s.cls)})<br>${p.date} · ${esc(p.method)}<h3>${money(p.amount)}</h3>Balance: ${money(bal(s))}`)},
slips:()=>showDoc(`<h3>${esc(school())} · Parent codes</h3><div class="mu">Open ${esc(location.origin)} and enter your child's code.</div>`+fl().map(s=>`<div style="border-bottom:1px dashed #999;padding:6px 0"><b>${esc(s.name)}</b> (${esc(s.cls)}) — <b>${esc(s.code)}</b></div>`).join('')),
addT:()=>{if(!val('tn'))return;const t={name:val('tn'),email:val('te'),phone:val('tphn').replace(/\s/g,''),salary:+val('ts')||0,ded:+val('td')||0,bank:val('tb'),acct:val('ta')},id=uid();w(async()=>{await setDoc(doc(db,'teachers',id),t);await syncT({...t,id})})},
runPay:()=>D.teachers.forEach(t=>{if(!sal(t)){const r={tid:t.id,month:mk(),bonus:0,ded:t.ded||0,amount:net(t),paid:false,date:''};w(async()=>{await setDoc(doc(db,'salaries',t.id+'_'+mk()),r);await syncT(t,{...r,id:t.id+'_'+mk()})})}}),
markAll:()=>D.salaries.filter(x=>x.month===mk()&&!x.paid).forEach(x=>w(async()=>{await updateDoc(doc(db,'salaries',x.id),{paid:true,date:today()});const t=D.teachers.find(z=>z.id===x.tid);if(t)await syncT(t,{...x,paid:true,date:today()})})),
paySal:id=>{const t=D.teachers.find(x=>x.id===id),b=+$('b'+id).value||0,r={tid:id,month:mk(),bonus:b,ded:t.ded||0,amount:(t.salary||0)+b-(t.ded||0),paid:true,date:today()};w(async()=>{await setDoc(doc(db,'salaries',id+'_'+mk()),r);await syncT(t,{...r,id:id+'_'+mk()})})},
slip:id=>{const t=D.teachers.find(x=>x.id===id),x=sal(t)||{};showDoc(`<h2>${esc(school())}</h2><b>Payslip ${mk()}</b><hr>${esc(t.name)}<br>Basic ${money(t.salary)}<br>Bonus ${money(x.bonus)}<br>Deduction -${money(x.ded??t.ded)}<h3>Net ${money(x.amount??net(t))}</h3>${x.paid?'Paid '+x.date:'Due'}`)},
exStud:()=>save('fees.csv',[['Name','Class','Fee','Paid','Balance'],...D.students.map(s=>[s.name,s.cls,s.fee,paid(s.id),bal(s)])]),
exBank:()=>save('salary-transfer-'+mk()+'.csv',[['Name','Bank','Account','Amount'],...D.teachers.map(t=>[t.name,t.bank,t.acct,(sal(t)||{}).amount??net(t)])]),
saveSet:()=>{S={name:val('x1'),prop:val('x2'),hm:val('x3'),bank:val('x4'),accName:val('x5'),accNo:val('x6'),cur:val('x7')||'₦'};cur=S.cur;w(async()=>{await setDoc(doc(db,'settings','main'),S);await setDoc(doc(db,'settings','public'),{name:S.name,bank:S.bank,accName:S.accName,accNo:S.accNo,cur:S.cur});$('sn').textContent='🏫 '+S.name})}});
</script></body></html>
